[project]
name = "yfdata"
version = "0.2.1"
description = "Client for Yahoo Finance data"
authors = [
    { name = "andrea", email = "vegavis@icloud.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.3",
    "curl-cffi>=0.15.0",
]

[dependency-groups]
dev = [
    "bump-my-version>=1.0",
    "ruff>=0.15",
    "gitchangelog>=3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

docs = [
    "pystache>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=yfdata",
    "--cov-report=term-missing",
]
markers = [
    "integration: tests that call the Yahoo Finance API",
]

[tool.coverage.run]
source = ["yfdata"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bumpversion]
current_version = "0.2.1"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
