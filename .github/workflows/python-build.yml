name: Python Application
run-name: ${{ github.actor }} is building ${{ github.repository }}

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Build package
        run: uv build --out-dir build-dist

      - name: Run Ruff lint
        run: uv run --frozen ruff check .

      - name: Check Ruff formatting
        run: uv run --frozen ruff format --check .

      - name: Run unit tests with coverage
        run: uv run --frozen pytest -m "not integration"

      - name: Run Yahoo Finance integration tests
        env:
          YFDATA_RUN_INTEGRATION: "1"
        run: uv run --frozen pytest -m integration
